name: Fix EXPEC direct login

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch EXPEC route
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server.js")
          text = path.read_text(encoding="utf-8")

          old = 'app.get("/expec.html", exigirLogin, async (req, res) => {'
          new = '''app.get("/expec.html", async (req, res, next) => {
              if (!req.session.usuario) {
                  return res.redirect("/login.html");
              }
              next();
          }, exigirLogin, async (req, res) => {'''

          if old not in text:
              raise SystemExit("EXPEC route already patched or not found")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Fix EXPEC direct URL login redirect"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-expec-login.yml
          git commit -m "Remove temporary EXPEC fix workflow"
          git push
