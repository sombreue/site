<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EXPEC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>EXPEC</h1>

        <a href="/">Voltar para tarefas</a>
    </header>

    <main>

    <section class="feira-equipes">

        <div class="secao-cabecalho">
            <div>
                <h2>Equipes</h2>
                <p>Equipes participantes da EXPEC</p>
            </div>

            <button id="btnCriarEquipe" style="display: none;">
                + Criar equipe
            </button>
        </div>

        <div id="listaEquipes">
            <p>Carregando equipes...</p>
        </div>

    </section>

    <!-- FORMULÁRIO -->
    <div id="modalEquipe" class="modal" style="display: none;">

        <div class="modal-conteudo">

            <h2 id="tituloModal">Criar equipe</h2>

            <form id="formEquipe">

                <label>
                    Nome da equipe
                    <input
                        type="text"
                        id="nomeEquipe"
                        placeholder="Ex: Equipe 1"
                        required
                    >
                </label>

                <label>
                    Tema
                    <input
                        type="text"
                        id="temaEquipe"
                        placeholder="Ex: Meio Ambiente"
                        required
                    >
                </label>

                <label>
                    Professor
                    <input
                        type="text"
                        id="professorEquipe"
                        placeholder="Ex: Professor João"
                    >
                </label>

                <label>
                    Integrantes
                    <textarea
                        id="integrantesEquipe"
                        placeholder="Ex: João, Maria, Pedro..."
                    ></textarea>
                </label>

                <div class="modal-botoes">

                    <button type="button" id="btnCancelar">
                        Cancelar
                    </button>

                    <button type="submit">
                        Salvar
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>

    <script src="expec.js"></script>

</body>

</html>
