<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" href="/imagens/favicon.ico"><title>Minhas tarefas — Agenda auruda</title><link rel="stylesheet" href="themes.css?v=20260908"><link rel="stylesheet" href="tarefas-pessoais.css?v=20260911"><script>document.documentElement.dataset.theme=localStorage.getItem('agenda-auruda-tema')||'ruby';</script>
<style>
.fonte-tarefa{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 9px;border-radius:999px;background:var(--surface-2);font-size:.82rem;opacity:.9}.fonte-tarefa small{opacity:.72}.painel-origens{margin-top:14px}.origem-abas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.origem-aba{padding:9px 13px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);cursor:pointer}.origem-aba.ativa{border-color:var(--accent);background:var(--surface-3)}.lista-origens{display:grid;gap:9px;max-height:360px;overflow:auto}.origem-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}.origem-item h3{margin:0 0 4px}.origem-item p{margin:0;font-size:.9rem;opacity:.78}.origem-item button{flex:0 0 auto}.origem-form{display:grid;grid-template-columns:1fr 180px 150px;gap:10px;align-items:end;margin-top:12px}.origem-form label{display:flex;flex-direction:column;gap:5px;font-weight:600}.origem-form input,.origem-form select{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text)}.origem-vazio{padding:18px;text-align:center;opacity:.7}.modal-origens{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.55)}.modal-origens[hidden]{display:none}.modal-origens-conteudo{width:min(900px,100%);max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}.modal-origens-cabecalho{display:flex;justify-content:space-between;gap:15px;align-items:center}.modal-origens-cabecalho button{border:0;background:transparent;color:var(--text);font-size:1.5rem;cursor:pointer}.@media(max-width:700px){.origem-form{grid-template-columns:1fr}.origem-item{align-items:flex-start;flex-direction:column}.origem-item button{width:100%}}
</style>
</head>
<body>
<header class="topo"><a href="/area-do-aluno.html" class="voltar">← Área do aluno</a><div><h1>Minhas tarefas</h1><p>Organize o que você quer fazer e quando pretende fazer.</p></div></header>
<main>
<section class="resumo"><div><strong id="total">0</strong><span>Total</span></div><div><strong id="pendentes">0</strong><span>Pendentes</span></div><div><strong id="planejadas">0</strong><span>Planejadas</span></div></section>
<section class="barra"><button id="nova">+ Nova tarefa</button><button id="puxar-origem" type="button">📥 Puxar da Agenda/Trabalhos</button><select id="filtro-prioridade"><option value="">Todas as prioridades</option><option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option></select><label class="selecionar-todas"><input type="checkbox" id="selecionar-todas"> Selecionar todas</label><button id="fazer-selecionadas" class="acao-multipla" disabled>Feitas selecionadas</button><a class="ajuda-markdown" href="/markdown.html">Como usar Markdown?</a></section>
<section id="formulario" class="painel" hidden><h2 id="titulo-form">Nova tarefa</h2><form id="form"><div class="grid"><label>Título<input id="titulo" maxlength="160" required placeholder="Ex.: Fazer exercícios de Física"></label><label>Matéria<input id="materia" maxlength="80" placeholder="Ex.: Física"></label><label>Prazo de entrega<input id="prazo" type="date"></label><label>Quero fazer em<input id="planejada" type="date"><small>Essa é a data em que você pretende realizar a tarefa.</small></label><label>Prioridade<select id="prioridade"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option></select></label></div><label>Descrição <span>(Markdown)</span><textarea id="descricao" rows="10" placeholder="# O que preciso fazer\n\n- Parte 1\n- Parte 2\n\n**Lembrete:** levar o material.\n\nUse Markdown para organizar como quiser."></textarea><div class="botoes"><button type="submit">Salvar tarefa</button><button type="button" class="secundario" id="cancelar">Cancelar</button></div><p id="mensagem"></p></form></section>
<section id="lista" class="lista"></section>
</main>
<div id="modal-origens" class="modal-origens" hidden><div class="modal-origens-conteudo"><div class="modal-origens-cabecalho"><div><h2>Puxar atividade</h2><p>Escolha uma atividade da Agenda ou de Trabalhos & Pesquisas e informe apenas o dia em que você pretende fazê-la.</p></div><button type="button" id="fechar-origens" aria-label="Fechar">×</button></div><div class="origem-abas"><button type="button" class="origem-aba ativa" data-origem-aba="agenda">📅 Agenda</button><button type="button" class="origem-aba" data-origem-aba="trabalho">📚 Trabalhos & Pesquisas</button></div><div id="lista-origens" class="lista-origens"></div><div class="origem-form"><label>Vou fazer em<input type="date" id="origem-data-planejada" required></label><label>Prioridade<select id="origem-prioridade"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option></select></label><button type="button" id="confirmar-origem" disabled>Adicionar às minhas tarefas</button></div><p id="origem-mensagem" aria-live="polite"></p></div></div>
<script src="temas.js?v=20260911"></script><script src="tarefas-pessoais.js?v=20260915-origens1"></script>
</body></html>
