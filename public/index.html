<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/imagens/favicon.ico">
    <title>Agenda auruda</title>
    <link rel="stylesheet" href="style.css?v=20260907-lightfix">
    <link rel="stylesheet" href="light-theme-fix.css?v=20260907-1">
    <link rel="stylesheet" href="admin-panel.css?v=20260907-1">
</head>
<body>
<header>
    <img src="https://i.imgur.com/NKvDhdY.png" alt="Logo" class="logo">
    <p>ve os coiso ai</p>
    <img src="imagens/9b4f4f0aa25822641fe46c5104d62a8c.jpg" alt="Foto" class="foto">
    <a href="/imagens/image.png" target="_blank" class="botao-imagem">HORARIO DE AULAS</a>
    <a href="/expec.html" class="botao-expec">EXPEC</a>
    <div id="usuario-logado"></div>
    <button id="botao-logout" onclick="logout()">Sair</button>
</header>

<section id="painel-admin" class="painel-admin" style="display: none;">
    <div class="painel-admin-cabecalho">
        <h2>Administração</h2>
        <button
            type="button"
            id="botao-minimizar-admin"
            class="botao-minimizar-admin"
            aria-expanded="true"
            aria-controls="conteudo-painel-admin"
            aria-label="Minimizar painel de administração"
            title="Minimizar painel"
        >−</button>
    </div>

    <div id="conteudo-painel-admin" class="conteudo-painel-admin">
        <h3>Criar usuário</h3>
        <input type="text" id="novo-usuario" placeholder="Nome de usuário">
        <input type="password" id="nova-senha" placeholder="Senha">
        <button onclick="criarUsuario()">Criar conta</button>
        <h3>Usuários cadastrados</h3>
        <div id="lista-usuarios"></div>
    </div>
</section>

<main>
    <section class="filtro">
        <label for="data">Pesquisar por data:</label>
        <input type="date" id="data" onchange="filtrarPorData()">
        <button onclick="limparFiltro()">Mostrar todas</button>
    </section>

    <div class="area-adicionar" id="area-adicionar" style="display: none;">
        <button class="botao-adicionar" onclick="abrirFormulario()">+ Adicionar tarefas</button>
    </div>

    <section id="formulario" class="formulario" style="display: none;">
        <h2>Adicionar tarefas</h2>
        <label for="nova-data">Data:</label>
        <input type="date" id="nova-data" onchange="mostrarMateriasDoDia()">
        <div id="lista-materias-formulario"></div>
        <div class="botoes-formulario">
            <button onclick="adicionarTarefasDoDia()">Adicionar tarefas</button>
            <button class="cancelar" onclick="fecharFormulario()">Cancelar</button>
        </div>
    </section>

    <section id="lista-tarefas"></section>

    <section id="modal-senha" class="modal-senha">
        <div class="conteudo-modal">
            <h2>Alterar senha</h2>
            <p id="usuario-senha"></p>
            <input type="password" id="senha-alterada" placeholder="Digite a nova senha">
            <div class="botoes-modal">
                <button onclick="confirmarAlteracaoSenha()">Alterar senha</button>
                <button class="cancelar" onclick="fecharModalSenha()">Cancelar</button>
            </div>
        </div>
    </section>
</main>

<script src="script.js?v=20260907"></script>
<script src="temas.js?v=20260907-lightfix"></script>
<script src="admin-panel.js?v=20260907-1"></script>
</body>
</html>
